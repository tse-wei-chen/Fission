name: container

on:
  push:
    branches: [ develop ]
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - .env.example
      - Directory.Build.props
      - Fission.slnx
      - global.json
      - src/**
      - benchmarks/Fission.Serving.LoadGen/**
      - .github/workflows/container.yml
  pull_request:
    branches: [ develop ]
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - .env.example
      - Directory.Build.props
      - Fission.slnx
      - global.json
      - src/**
      - benchmarks/Fission.Serving.LoadGen/**
      - .github/workflows/container.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag fission:ci .

      - name: Smoke test server image
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name fission-container-ci \
            --publish 18000:8000 \
            fission:ci

          cleanup() {
            docker logs fission-container-ci || true
            docker rm --force fission-container-ci || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Fission container did not become ready." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"model":"container-smoke","prompt":"hello","max_tokens":2,"stream":false}' \
            http://127.0.0.1:18000/v1/completions > /tmp/fission-response.json

          python3 - <<'PY'
          import json

          with open('/tmp/fission-response.json', encoding='utf-8') as handle:
              payload = json.load(handle)

          assert payload['object'] == 'text_completion', payload
          assert len(payload['choices']) == 1, payload
          assert payload['choices'][0]['finish_reason'] == 'length', payload
          assert payload['usage']['completion_tokens'] == 2, payload
          PY

          dotnet run \
            --project benchmarks/Fission.Serving.LoadGen/Fission.Serving.LoadGen.csproj \
            -c Release -- \
            --url http://127.0.0.1:18000 \
            --model container-loadgen \
            --requests 8 \
            --concurrency 4 \
            --max-tokens 4 \
            --warmup 2 \
            --timeout-seconds 30 \
            --output /tmp/fission-loadgen.json

          cat /tmp/fission-loadgen.json
