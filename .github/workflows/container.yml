name: container

on:
  push:
    branches: [ develop ]
    paths:
      - Dockerfile
      - Dockerfile.cuda
      - compose.yaml
      - compose.cuda.yaml
      - .dockerignore
      - .env.example
      - .env.cuda.example
      - Directory.Build.props
      - Fission.slnx
      - global.json
      - src/**
      - benchmarks/Fission.Serving.LoadGen/**
      - benchmarks/Fission.Serving.Reporter/**
      - benchmarks/serving/**
      - eng/run-serving-suite.ps1
      - eng/run-nvidia-smoke.ps1
      - eng/run-nvidia-serving-benchmark.ps1
      - eng/run-nvidia-qualification.ps1
      - eng/run-nvidia-semantic-parity.ps1
      - eng/validate-serving-suite-results.ps1
      - eng/compare-serving-semantic-parity.ps1
      - eng/summarize-ort-profile.ps1
      - eng/add-greedy-argmax-output.py
      - eng/convert-onnx-fp16.py
      - .github/workflows/container.yml
  pull_request:
    branches: [ develop ]
    paths:
      - Dockerfile
      - Dockerfile.cuda
      - compose.yaml
      - compose.cuda.yaml
      - .dockerignore
      - .env.example
      - .env.cuda.example
      - Directory.Build.props
      - Fission.slnx
      - global.json
      - src/**
      - benchmarks/Fission.Serving.LoadGen/**
      - benchmarks/Fission.Serving.Reporter/**
      - benchmarks/serving/**
      - eng/run-serving-suite.ps1
      - eng/run-nvidia-smoke.ps1
      - eng/run-nvidia-serving-benchmark.ps1
      - eng/run-nvidia-qualification.ps1
      - eng/run-nvidia-semantic-parity.ps1
      - eng/validate-serving-suite-results.ps1
      - eng/compare-serving-semantic-parity.ps1
      - eng/summarize-ort-profile.ps1
      - eng/add-greedy-argmax-output.py
      - eng/convert-onnx-fp16.py
      - .github/workflows/container.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate Compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.cuda.yaml config --quiet

      - name: Validate NVIDIA runner syntax
        shell: pwsh
        run: |
          foreach ($path in @(
            "./eng/run-nvidia-smoke.ps1",
            "./eng/run-nvidia-serving-benchmark.ps1",
            "./eng/run-nvidia-qualification.ps1",
            "./eng/run-nvidia-semantic-parity.ps1",
            "./eng/validate-serving-suite-results.ps1",
            "./eng/compare-serving-semantic-parity.ps1",
            "./eng/summarize-ort-profile.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [void] [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref] $tokens,
              [ref] $errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate ORT profile summarizer
        shell: pwsh
        run: |
          @'
          [
            {
              "cat": "Node",
              "name": "MemcpyFromHost_kernel_time",
              "dur": 125.0,
              "args": {
                "provider": "CUDAExecutionProvider",
                "op_name": "MemcpyFromHost"
              }
            },
            {
              "cat": "Node",
              "name": "MatMul_kernel_time",
              "dur": 875.0,
              "args": {
                "provider": "CUDAExecutionProvider",
                "op_name": "MatMul"
              }
            },
            {
              "cat": "Node",
              "name": "Shape_kernel_time",
              "dur": 50.0,
              "args": {
                "provider": "CPUExecutionProvider",
                "op_name": "Shape"
              }
            }
          ]
          '@ | Set-Content ./artifacts-ort-profile.json -Encoding UTF8

          pwsh ./eng/summarize-ort-profile.ps1 `
            -ProfilePath ./artifacts-ort-profile.json `
            -MarkdownPath ./artifacts-ort-profile.md `
            -JsonPath ./artifacts-ort-profile-summary.json

          $summary = Get-Content ./artifacts-ort-profile-summary.json -Raw | ConvertFrom-Json
          if ($summary.node_event_count -ne 3) {
            throw "Expected three summarized ORT node events."
          }
          if ($summary.memcpy_event_count -ne 1) {
            throw "Expected one summarized Memcpy event."
          }
          if ([math]::Abs($summary.memcpy_percent_of_node_duration - 11.9047619) -gt 0.001) {
            throw "Unexpected Memcpy duration share."
          }

      - name: Validate ONNX graph rewrite syntax
        run: |
          python3 -m py_compile ./eng/add-greedy-argmax-output.py
          python3 -m py_compile ./eng/convert-onnx-fp16.py

      - name: Validate GPU serving manifests
        shell: pwsh
        run: |
          foreach ($manifestPath in @(
            "./benchmarks/serving/workloads.gpu-smoke.json",
            "./benchmarks/serving/workloads.gpu-qualification.json"
          )) {
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.schema_version -ne 1) {
              throw "$manifestPath must use schema_version 1."
            }
            if (@($manifest.workloads).Count -eq 0) {
              throw "$manifestPath must contain workloads."
            }
            foreach ($workload in @($manifest.workloads)) {
              if ([string]::IsNullOrWhiteSpace([string] $workload.prompt_file)) {
                throw "$manifestPath workload '$($workload.name)' must specify prompt_file."
              }
              $promptPath = Join-Path ./benchmarks/serving ([string] $workload.prompt_file)
              if (-not (Test-Path -LiteralPath $promptPath -PathType Leaf)) {
                throw "$manifestPath workload '$($workload.name)' references missing prompt '$promptPath'."
              }
            }
          }

          $parity = Get-Content ./benchmarks/serving/semantic-parity.json -Raw | ConvertFrom-Json
          if ($parity.schema_version -ne 1 -or @($parity.cases).Count -lt 4) {
            throw "Semantic parity corpus must use schema_version 1 and contain at least four cases."
          }

      - name: Build image
        run: docker build --tag fission:ci .

      - name: Smoke test one-shot startup probe
        shell: bash
        run: |
          set -euo pipefail

          timeout 30s docker run --rm \
            --env Fission__StartupProbeEnabled=true \
            --env Fission__StartupProbeExitAfterSuccess=true \
            --env Fission__StartupProbePrompt=probe \
            --env Fission__StartupProbeMaxTokens=1 \
            --env Fission__ModelId=container-probe \
            fission:ci

      - name: Smoke test server image
        shell: bash
        run: |
          set -euo pipefail

          docker run --detach \
            --name fission-container-ci \
            --publish 18000:8000 \
            --env Fission__ControlToken=ci-control-token \
            fission:ci

          cleanup() {
            docker logs fission-container-ci || true
            docker rm --force fission-container-ci || true
          }
          trap cleanup EXIT

          ready=0
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/healthz > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Fission container did not become ready." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"model":"container-smoke","prompt":"hello","max_tokens":2,"stream":false}' \
            http://127.0.0.1:18000/v1/completions > /tmp/fission-response.json

          python3 - <<'PY'
          import json

          with open('/tmp/fission-response.json', encoding='utf-8') as handle:
              payload = json.load(handle)

          assert payload['object'] == 'text_completion', payload
          assert len(payload['choices']) == 1, payload
          assert payload['choices'][0]['finish_reason'] == 'length', payload
          assert payload['usage']['completion_tokens'] == 2, payload
          PY

          unauthorized_generate_status="$(curl --silent --output /tmp/fission-control-generate-unauthorized.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"model":"container-smoke","prompt":"hello","max_tokens":2}' \
            http://127.0.0.1:18000/internal/control/generate)"
          if [ "$unauthorized_generate_status" -ne 401 ]; then
            echo "Expected unauthenticated control generation to return 401, got $unauthorized_generate_status." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-Fission-Control-Token: ci-control-token' \
            --data '{"model":"container-smoke","prompt":"hello","max_tokens":2}' \
            http://127.0.0.1:18000/internal/control/generate > /tmp/fission-control-generate.json

          python3 - <<'PY'
          import json

          with open('/tmp/fission-control-generate.json', encoding='utf-8') as handle:
              payload = json.load(handle)

          assert len(payload['token_ids']) == 2, payload
          assert payload['completion_tokens'] == 2, payload
          assert payload['finish_reason'] == 'length', payload
          assert isinstance(payload['text'], str), payload
          PY

          pwsh ./eng/run-serving-suite.ps1 \
            -Label fission-ci \
            -BaseUrl http://127.0.0.1:18000 \
            -Model container-loadgen \
            -Manifest benchmarks/serving/workloads.ci.json \
            -OutputDirectory artifacts/serving-ci \
            -Configuration Release

          pwsh ./eng/validate-serving-suite-results.ps1 \
            -ManifestPath benchmarks/serving/workloads.ci.json \
            -ResultsRoot artifacts/serving-ci \
            -Label fission-ci \
            -Repetitions 1 \
            -Model container-loadgen

          dotnet run \
            --project benchmarks/Fission.Serving.Reporter/Fission.Serving.Reporter.csproj \
            -c Release -- \
            --input artifacts/serving-ci \
            --markdown artifacts/serving-ci/report.md \
            --csv artifacts/serving-ci/report.csv

          cat artifacts/serving-ci/report.md
          cat artifacts/serving-ci/report.csv

          unauthorized_status="$(curl --silent --output /tmp/fission-control-unauthorized.json --write-out '%{http_code}' --request POST http://127.0.0.1:18000/internal/control/shutdown)"
          if [ "$unauthorized_status" -ne 401 ]; then
            echo "Expected unauthenticated shutdown to return 401, got $unauthorized_status." >&2
            exit 1
          fi

          shutdown_status="$(curl --silent --output /tmp/fission-control-shutdown.json --write-out '%{http_code}' --request POST --header 'X-Fission-Control-Token: ci-control-token' http://127.0.0.1:18000/internal/control/shutdown)"
          if [ "$shutdown_status" -ne 202 ]; then
            echo "Expected authenticated shutdown to return 202, got $shutdown_status." >&2
            cat /tmp/fission-control-shutdown.json >&2 || true
            exit 1
          fi

          stopped=0
          for _ in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Running}}' fission-container-ci)" = "false" ]; then
              stopped=1
              break
            fi
            sleep 1
          done

          if [ "$stopped" -ne 1 ]; then
            echo "Fission container did not stop gracefully." >&2
            exit 1
          fi

          exit_code="$(docker inspect --format '{{.State.ExitCode}}' fission-container-ci)"
          if [ "$exit_code" -ne 0 ]; then
            echo "Fission container exited with code $exit_code." >&2
            exit 1
          fi

          {
            echo "## Serving benchmark smoke report"
            echo
            cat artifacts/serving-ci/report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload serving benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serving-benchmark-${{ github.run_id }}
          path: artifacts/serving-ci
          if-no-files-found: ignore
          retention-days: 14
