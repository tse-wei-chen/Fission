name: build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Fission.slnx
      - run: dotnet build Fission.slnx -c Release --no-restore
      - name: Report scheduler microbenchmark
        run: dotnet run --project benchmarks/Fission.Scheduler.Benchmarks/Fission.Scheduler.Benchmarks.csproj -c Release --no-build -- 2000
      - name: Run samples
        shell: pwsh
        run: ./eng/run-projects.ps1 -Root samples -Configuration Release -NoBuild
      - name: Run specs
        shell: pwsh
        run: ./eng/run-projects.ps1 -Root tests -Configuration Release -NoBuild