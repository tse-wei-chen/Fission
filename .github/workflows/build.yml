name: build

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Fission.slnx
      - run: dotnet build Fission.slnx -c Release --no-restore
      - run: dotnet run --project samples/Fission.Demo/Fission.Demo.csproj -c Release --no-build
      - run: dotnet run --project samples/Fission.PlanDemo/Fission.PlanDemo.fsproj -c Release --no-build
      - run: dotnet run --project tests/Fission.Runtime.Specs/Fission.Runtime.Specs.csproj -c Release --no-build
      - run: dotnet run --project tests/Fission.Scheduler.Specs/Fission.Scheduler.Specs.fsproj -c Release --no-build
      - run: dotnet run --project tests/Fission.Engine.Specs/Fission.Engine.Specs.csproj -c Release --no-build
      - run: dotnet run --project tests/Fission.Server.Specs/Fission.Server.Specs.csproj -c Release --no-build
      - run: dotnet run --project tests/Fission.OnnxRuntime.Specs/Fission.OnnxRuntime.Specs.csproj -c Release --no-build
      - run: dotnet run --project tests/Fission.BackendTransactions.Specs/Fission.BackendTransactions.Specs.csproj -c Release --no-build
